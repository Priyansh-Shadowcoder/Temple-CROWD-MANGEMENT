<!DOCTYPE html>
<html>
<head>
    <title>Gate {{ num }} Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="p-4">
    <div class="container">
        <a href="/admin/dashboard?date={{ selected_date }}" class="btn btn-temple-outline mb-4">&larr; Back to Dashboard</a>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 style="color: #8b0000;">{{ type|capitalize }} Gate {{ num }} Monitor <span class="badge bg-secondary fs-6">{{ selected_date }}</span></h2>
            <button class="btn btn-warning text-dark fw-bold shadow-sm" onclick="alert('Emergency Team Dispatched to {{ type|capitalize }} Gate {{ num }}!')">
                🚨 Dispatch Security Team
            </button>
        </div>
        
        <div class="temple-card">
            <div class="p-3">
                <table class="table table-hover mt-2">
                    <thead class="table-light"><tr><th>Pass ID</th><th>Devotee Name</th><th>Date</th></tr></thead>
                    <tbody>
                        {% for p in passes %}
                        <tr><td>#{{ p.id }}</td><td class="fw-bold">{{ p.member_name }}</td><td>{{ p.date }}</td></tr>
                        {% else %}
                        <tr><td colspan="3" class="text-center text-muted py-4">No passes routed to this gate for this date.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
