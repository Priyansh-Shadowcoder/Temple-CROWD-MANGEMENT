<!DOCTYPE html>
<html>
<head>
    <title>Temple Management - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <h1 style="color: #8b0000; font-weight: bold;">Shree Mandir Portal</h1>
            </div>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert alert-warning text-center">{{ messages[0] }}</div>
              {% endif %}
            {% endwith %}

            <div class="temple-card p-4">
                <h4 class="text-center mb-4">Register New Account</h4>
                <form action="{{ url_for('signup') }}" method="POST">
                    <input type="text" name="name" class="form-control mb-3" placeholder="Full Name" required>
                    <input type="email" name="email" class="form-control mb-3" placeholder="Email Address" required>
                    <input type="password" name="password" class="form-control mb-3" placeholder="Create Password" required>
                    <select name="role" class="form-select mb-4">
                        <option value="pilgrim">Devotee (Pilgrim)</option>
                        <option value="admin">Temple Administrator</option>
                    </select>
                    <button type="submit" class="btn btn-temple-primary w-100 py-2">Register Now</button>
                </form>
                <div class="text-center mt-3">
                    <small>Already registered? <a href="{{ url_for('index') }}" style="color: #d35400;">Login Here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
