<!DOCTYPE html>
<html>
<head>
    <title>Admin Access - Shree Mandir Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-color: #f4e8d3;"> <!-- Slightly darker background for admin context -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <h2 style="color: #8b0000; font-weight: bold;">Administrator Access</h2>
                <p class="text-muted">Authorized Personnel Only</p>
            </div>
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert alert-danger text-center fw-bold">{{ messages[0] }}</div>
              {% endif %}
            {% endwith %}
            
            <div class="temple-card p-4 shadow-lg" style="border-top: 4px solid #8b0000;">
                <h4 class="text-center mb-4">Admin Login</h4>
                <form action="/admin_login" method="POST">
                    <input type="email" name="email" class="form-control mb-3" placeholder="Admin Email" required>
                    <input type="password" name="password" class="form-control mb-4" placeholder="Admin Password" required>
                    <button type="submit" class="btn w-100 py-2 text-white" style="background-color: #8b0000;">Secure Login</button>
                </form>
            </div>
            
            <!-- Link back to Devotee Portal -->
            <div class="text-center mt-4">
                <a href="{{ url_for('index') }}" class="text-muted" style="text-decoration: none; font-size: 0.9em;">
                    &larr; Return to Devotee Portal
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
